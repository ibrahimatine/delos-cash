name: Reconcile Bitnob operations

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Call the protected reconciliation endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Repository secret CRON_SECRET is required" >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://delos-cash.vercel.app/api/cron/reconcile
